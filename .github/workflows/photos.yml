# 한 시간마다 텔레그램 봇 대화방을 확인해요.
# - 보낸 사진과 동영상을 받아 보관함(릴리스 myphotos)에 올리고 기록해요.
# - 올렸어, 삭제 확인 같은 말을 처리해요. (scripts/cleanup.py)
# - 승인 전 시안 버튼·답장을 실제 작업으로 옮겨요. (scripts/tg_actions.py)
name: photos

on:
  schedule:
    - cron: "*/10 * * * *" # 10분마다. 승인 전 시안 버튼·답장을 밖에서도 빨리 이어 가려고 (2026-11-06). 5시대에도 돌아서 6시 제작 전에 사진이 들어와요.
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 비공개 사진 보관함 열쇠 확인
        env:
          PHOTOS_TOKEN: ${{ secrets.PHOTOS_TOKEN }}
        run: |
          [ -n "$PHOTOS_TOKEN" ] || { echo "PHOTOS_TOKEN 이 없어요"; exit 1; }
          code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $PHOTOS_TOKEN" https://api.github.com/repos/hong2-kim/jecheol-photos/contents/index.json)
          echo "보관함 응답: $code"
          [ "$code" = "200" ] || { echo "보관함을 읽지 못했어요. 열쇠가 만료됐거나 권한이 바뀌었는지 확인해 주세요."; exit 1; }
      - name: 그림 도구 설치
        run: pip install --quiet pillow # 같은 그림인지 알아보는 데 써요
      - name: 사진 받기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_I }}
          GITHUB_TOKEN: ${{ github.token }} # 삭제 확인을 받았을 때 보관함 파일을 지우는 데 써요
          FIX_ROUTINE_URL: ${{ secrets.FIX_ROUTINE_URL }} # 있으면 [고쳐서 다시]를 바로 고치기 루틴에 넘겨요
          FIX_ROUTINE_TOKEN: ${{ secrets.FIX_ROUTINE_TOKEN }}
        run: python scripts/fetch_photos.py
      - name: 받은 파일을 보관함(릴리스)에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls incoming/* >/dev/null 2>&1 || { echo "새로 받은 파일이 없어요"; exit 0; }
          gh release view myphotos >/dev/null 2>&1 || gh release create myphotos --title "보낸 사진과 동영상" --notes "텔레그램으로 보낸 원본을 두는 곳이에요. 영상 제작에 쓰여요."
          gh release upload myphotos incoming/* --clobber
      - name: 받은 기록 저장
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "jecheol-feed"
          git config user.email "actions@users.noreply.github.com"
          git add myphotos state logs videos requests
          REBUILD=no
          git diff --cached --name-only | grep -q "^state/videos.json$" && REBUILD=yes
          git diff --cached --quiet || git commit -m "텔레그램 대화방 확인"
          git pull --rebase
          git push
          # 올림·지움 표시가 바뀌었으면 RSS와 영상 페이지를 다시 만들어요
          if [ "$REBUILD" = yes ]; then gh workflow run publish.yml --ref main; fi
      - name: 버튼으로 정한 작업 부르기 # 기록을 올린 뒤에만: 뺀 장 넣어 다시 만들기(produce), 고치기 루틴 (scripts/tg_actions.py)
        env:
          GH_TOKEN: ${{ github.token }}
          FIX_ROUTINE_URL: ${{ secrets.FIX_ROUTINE_URL }}
          FIX_ROUTINE_TOKEN: ${{ secrets.FIX_ROUTINE_TOKEN }}
        run: cd scripts && python tg_actions.py dispatch
