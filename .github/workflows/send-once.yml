# 2026-11-12, 사용자가 승인한 2026 최남단 방어축제 쇼츠 최종본(사용자 녹음 46.5초, 540p 그대로)을 비공개 보관함에서 받아 텔레그램으로 한 번만 보내요.
# 허락 못 받은 사진이 들어 있어 공개 릴리스에는 올리지 않아요. 보낸 뒤 state/sent.json 에 표시를 남겨 다시 보내지 않아요. 끝나면 지워요.
name: send-once

on:
  push:
    branches: [main]
    paths: [".github/workflows/send-once.yml"]

permissions:
  contents: write

concurrency:
  group: send-once
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 날짜·중복 확인
        run: |
          d="$(TZ=Asia/Seoul date +%F)"
          [ "$d" = "2026-11-12" ] || [ "$d" = "2026-11-13" ]
          if grep -q '"2026-11-12-13-bangeo-final"' state/sent.json; then echo "이미 보냈어요"; exit 1; fi
      - name: 비공개 보관함에서 받기
        env:
          PHOTOS_TOKEN: ${{ secrets.PHOTOS_TOKEN }}
        run: |
          for f in mp4 html; do
            curl -fsSL -H "Authorization: Bearer $PHOTOS_TOKEN" -H "Accept: application/vnd.github.raw" \
              -o "s.$f" "https://api.github.com/repos/hong2-kim/jecheol-photos/contents/send/2026-11-12-13-bangeo-final.$f"
          done
          ls -la s.*
          [ "$(md5sum s.mp4 | cut -d' ' -f1)" = "7e59f6b500ba580962eabf14afc6ca74" ]
      - name: 텔레그램으로 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_I }}
        run: |
          API="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
          curl -fsS -o v.json "$API/sendVideo" --form-string "chat_id=$TELEGRAM_CHAT_ID" \
            --form-string "caption=[유튜브 쇼츠 · 최종 승인본] 20만 명 몰리는 제주 방어축제, 올해 일정과 즐길 거리 (11.19~22 모슬포항)" \
            --form-string "supports_streaming=true" -F "width=540" -F "height=960" -F "duration=47" -F "video=@s.mp4;type=video/mp4"
          python3 -c "import json;r=json.load(open('v.json'));assert r['ok'];print('영상 message_id',r['result']['message_id'])"
          curl -fsS -o m.json "$API/sendMessage" --form-string "chat_id=$TELEGRAM_CHAT_ID" \
            --form-string "parse_mode=HTML" --form-string "disable_web_page_preview=true" -F "text=<s.html"
          python3 -c "import json;r=json.load(open('m.json'));assert r['ok'];print('안내 message_id',r['result']['message_id'])"
      - name: 보낸 기록 남기기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main
            python3 - <<'EOF'
          import json
          p = "state/sent.json"
          d = json.load(open(p, encoding="utf-8"))
          for k in ("2026-11-12-13-bangeo-final", "2026-11-19-13-bangeo"):
              if k not in d:
                  d.append(k)
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          open(p, "a", encoding="utf-8").write("\n")
          EOF
            git add state/sent.json
            git commit -q -m "방어축제 최종본 텔레그램 1회 전송 기록 [skip ci]" || true
            git push -q origin HEAD:main && break
            sleep 5
          done
