# 2026-11-19, 사용자가 승인한("응 둘다해") 11-18 「삼겹살 vs 목살」 수정본(Leda, 58.6초)을 비공개 보관함에서 받아 텔레그램으로 한 번만 보내요.
# 11-18 아침의 「삼겹살 vs 앞다리살」(videos/2026-11-18/10-voice.json, 확인 필요 보류)은 그대로 두고 보내지 않아요.
# 사진·영상은 Pexels·YouTube CC BY·플리커 CC BY·위키미디어·관광공사 공공누리라 공개 릴리스에도 올려요.
# 보낸 뒤 state/sent.json 에 표시를 남겨 다시 보내지 않아요.
name: send-once

on:
  push:
    branches: [main]
    paths: [".github/workflows/send-once.yml"]

permissions:
  contents: write

concurrency:
  group: send-once
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 날짜·중복 확인
        run: |
          d="$(TZ=Asia/Seoul date +%F)"
          [ "$d" = "2026-11-19" ] || [ "$d" = "2026-11-20" ]
          if grep -q '"2026-11-18-10-voice-v2"' state/sent.json; then echo "이미 보냈어요"; exit 1; fi
      - name: 비공개 보관함에서 받기
        env:
          PHOTOS_TOKEN: ${{ secrets.PHOTOS_TOKEN }}
        run: |
          for f in mp4 jpg html; do
            curl -fsSL -H "Authorization: Bearer $PHOTOS_TOKEN" -H "Accept: application/vnd.github.raw" \
              -o "s.$f" "https://api.github.com/repos/hong2-kim/jecheol-photos/contents/send/2026-11-18-10-voice-v2.$f"
          done
          ls -la s.*
          [ "$(md5sum s.mp4 | cut -d' ' -f1)" = "8ce4e8cfb3482c5da5a0931618a93c80" ]
      - name: 공개 릴리스에 올리기(내려받기 주소)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp s.mp4 2026-11-18-10-voice-v2.mp4
          gh release upload v2026-11-18 2026-11-18-10-voice-v2.mp4 --clobber --repo "$GITHUB_REPOSITORY" || gh release create v2026-11-18 2026-11-18-10-voice-v2.mp4 --title v2026-11-18 --notes "" --repo "$GITHUB_REPOSITORY"
      - name: 텔레그램으로 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_I }}
        run: |
          API="https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN"
          curl -fsS -o v.json "$API/sendVideo" --form-string "chat_id=$TELEGRAM_CHAT_ID" \
            --form-string "caption=[유튜브 쇼츠 · 내레이션 · 수정본] 삼겹살파 vs 목살파, 맛·지방·굽는 법 비교 (11-18 앞다리살 영상 대신)" \
            --form-string "supports_streaming=true" -F "width=1080" -F "height=1920" -F "duration=59" -F "video=@s.mp4;type=video/mp4"
          python3 -c "import json;r=json.load(open('v.json'));assert r['ok'];print('영상 message_id',r['result']['message_id'])"
          curl -fsS -o p.json "$API/sendPhoto" --form-string "chat_id=$TELEGRAM_CHAT_ID" \
            --form-string "caption=삼겹살 vs 목살 썸네일(맨 앞 0초 장면)" -F "photo=@s.jpg;type=image/jpeg"
          python3 -c "import json;r=json.load(open('p.json'));assert r['ok'];print('썸네일 message_id',r['result']['message_id'])"
          curl -fsS -o m.json "$API/sendMessage" --form-string "chat_id=$TELEGRAM_CHAT_ID" \
            --form-string "parse_mode=HTML" --form-string "disable_web_page_preview=true" -F "text=<s.html"
          python3 -c "import json;r=json.load(open('m.json'));assert r['ok'];print('안내 message_id',r['result']['message_id'])"
      - name: 보낸 기록 남기기
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase -q origin main
            python3 - <<'EOF'
          import json
          p = "state/sent.json"
          d = json.load(open(p, encoding="utf-8"))
          if "2026-11-18-10-voice-v2" not in d:
              d.append("2026-11-18-10-voice-v2")
          json.dump(d, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          open(p, "a", encoding="utf-8").write("\n")
          EOF
            git add state/sent.json
            git commit -q -m "삼겹살 vs 목살 수정본 텔레그램 1회 전송 기록 [skip ci]" || true
            git push -q origin HEAD:main && break
            sleep 5
          done
