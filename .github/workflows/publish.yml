# 글이나 블로그 초안이 올라오면 RSS와 초안 페이지를 다시 만들어 공개하고, 텔레그램으로 알려요.
name: publish

on:
  push:
    branches: [main]
    paths: ["items/**", "blog/**", "config.json", "scripts/**", "state/blog_posted.json"] # 마지막 것은 네이버에 올린 기록 (이 컴퓨터가 올려요)
  schedule:
    - cron: "0 23 * * *" # 매일 오전 8시(한국 시간). 그날 글이 없으면 실패를 알려요.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 앞선 작업이 저장한 기록까지 받아요
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: RSS 만들기
        run: python scripts/build_feed.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: 텔레그램으로 알리기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_I }} # 이름이 한 글자 빠진 채 저장돼 있어도 읽어요
        run: python scripts/notify_telegram.py
      - name: 블로그 초안 알리기
        if: always() # 소식 글이 없는 날에도 초안은 알려요
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_I }}
        run: python scripts/notify_blog.py
      - name: 달마다 만드는 영상이 나왔는지 확인
        if: always() && github.event_name == 'schedule' # 오전 8시 점검 때만. 1~5일에 안 나온 것이 있으면 알려요
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_I }}
        run: python scripts/check_monthly.py
      - name: 보낸 기록 저장
        if: always()
        run: |
          git config user.name "jecheol-feed"
          git config user.email "actions@users.noreply.github.com"
          git add state logs
          git diff --cached --quiet || git commit -m "보낸 기록 갱신"
          git pull --rebase
          git push
