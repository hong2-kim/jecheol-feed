# 버튼 지킴이 (2026-11-06)
# 버튼 붙은 알림(승인 전 시안·뺀 장·블로그 보류·다시 만들기)을 보낸 뒤 3시간 동안 텔레그램을 지켜보다가,
# 누르거나 답장하면 photos 작업을 바로 불러요. 깃허브 일정 실행은 몇 시간씩 밀려서 이렇게 해요. (scripts/watch_buttons.py)
# - produce·publish 작업이 버튼을 보냈으면 이 작업을 불러요. 새로 불리면 앞의 것은 멈추고 다시 3시간을 세요.
# - requests/buttons-test.json 을 바꿔 올리면 연결 확인 버튼을 보내고 지켜봐요(시험용).
name: buttons

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "몇 시간 지켜볼지"
        default: "3"
      test:
        description: "연결 확인 버튼 보내기 (yes)"
        default: ""
  push:
    branches: [main]
    paths: ["requests/buttons-test.json"]

permissions:
  contents: read
  actions: write

concurrency:
  group: buttons # 기록을 쓰지 않아서 repo-write 와 따로 돌아요
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 텔레그램 지켜보기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_I }}
          GH_TOKEN: ${{ github.token }}
        run: python scripts/watch_buttons.py --hours "${{ github.event.inputs.hours || '3' }}" ${{ (github.event_name == 'push' || github.event.inputs.test == 'yes') && '--test' || '' }}
