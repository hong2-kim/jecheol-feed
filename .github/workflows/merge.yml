# Claude 가 claude/ 로 시작하는 가지에 글을 올리면 main 에 합치고 공개 작업을 불러요.
name: merge

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: write
  actions: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: main 에 합치기
        run: |
          git config user.name "jecheol-feed"
          git config user.email "actions@users.noreply.github.com"
          git merge --no-edit "origin/${GITHUB_REF_NAME}"
          git push origin main
          git push origin --delete "${GITHUB_REF_NAME}"
      - name: 공개 작업 부르기
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main
