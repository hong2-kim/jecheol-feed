# 영상 설계도(videos/날짜/*.json)가 올라오면 영상을 만들어 공개하고 텔레그램으로 보내요.
name: produce

on:
  push:
    branches: [main]
    paths: ["videos/**"]
  workflow_dispatch:
    inputs:
      day:
        description: "만들 날짜 (예: 2026-10-12). 비우면 오늘(한국 시간)"
        required: false
      only:
        description: "그 날의 한 가지만 (예: 2-news). 텔레그램 '뺀 장도 넣기' 버튼이 써요"
        required: false

permissions:
  contents: write
  pages: write
  actions: write # 버튼 지킴이(buttons.yml)를 불러요
  id-token: write

concurrency:
  group: repo-write
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # 앞선 작업이 저장한 기록까지 받아요
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 도구 설치
        run: |
          pip install --quiet playwright imageio-ffmpeg numpy pillow requests
          python -m playwright install --with-deps chromium
      - name: 날짜 정하기
        id: day
        run: |
          DAY="${{ github.event.inputs.day }}"
          if [ -z "$DAY" ] && [ "${{ github.event_name }}" = push ]; then # 지난 날 설계도를 고쳐 올렸으면 그 날을 다시 만들어요 (텔레그램 [고쳐서 다시])
            git fetch -q origin "${{ github.event.before }}" 2>/dev/null || true
            DAY=$(git diff --name-only "${{ github.event.before }}" HEAD -- videos 2>/dev/null | cut -d/ -f2 | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort -u | tail -1 || true)
          fi
          if [ -z "$DAY" ]; then DAY=$(TZ=Asia/Seoul date +%F); fi
          if [ ! -d "videos/$DAY" ]; then DAY=$(ls videos | sort | tail -1); fi
          echo "day=$DAY" >> "$GITHUB_OUTPUT"
          echo "만들 날짜: $DAY"
      - name: 영상 만들기
        env:
          PHOTOS_TOKEN: ${{ secrets.PHOTOS_TOKEN }} # 사용자 사진 비공개 보관함(jecheol-photos)을 읽는 열쇠
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }} # 내레이션 쇼츠 목소리
        run: python video/produce.py "${{ steps.day.outputs.day }}" ${{ github.event.inputs.only }}
      - name: 영상 파일 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DAY="${{ steps.day.outputs.day }}"
          FILES=$(ls dist/*.mp4 dist/*.jpg 2>/dev/null || true) # 영상과 카드 뉴스 그림
          [ -n "$FILES" ] || { echo "올릴 영상이 없어요"; exit 0; }
          gh release view "v$DAY" >/dev/null 2>&1 || gh release create "v$DAY" --title "$DAY 영상" --notes "$DAY 에 만든 먹거리 릴스와 카드 뉴스예요."
          gh release upload "v$DAY" $FILES --clobber
      - name: 주소 기록하고 텔레그램으로 보내기
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT_I }} # 이름이 한 글자 빠진 채 저장돼 있어도 읽어요
        run: python video/publish.py "${{ steps.day.outputs.day }}"
      - name: 버튼 지킴이 부르기 # 버튼 붙은 알림을 보냈으면 3시간 동안 바로바로 받게 해요 (buttons.yml)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: if [ -f build/buttons_sent ]; then gh workflow run buttons.yml --ref main || echo "버튼 지킴이를 부르지 못했어요"; else echo "보낸 버튼이 없어요"; fi
      - name: RSS 만들기
        run: python scripts/build_feed.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: 기록 저장
        if: always()
        run: |
          git config user.name "jecheol-feed"
          git config user.email "actions@users.noreply.github.com"
          git add state logs
          git diff --cached --quiet || git commit -m "영상 기록 갱신"
          python3 scripts/safe_push.py # 받아 다시 얹기·대량 삭제·받지 않은 저장소를 막고 올려요(2026-11-06)
